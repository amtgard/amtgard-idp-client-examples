services:
  web:
    image: nginx:alpine
    ports:
      - "37181:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    image: php:8.2-fpm
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    # We will need to run 'composer install' manually or via a command
