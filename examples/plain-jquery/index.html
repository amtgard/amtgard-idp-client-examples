<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amtgard IDP Client (jQuery SPA)</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        .status-line {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .status-value {
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        button {
            padding: 0.5rem;
            cursor: pointer;
            width: 100%;
        }

        .yes {
            color: green;
        }

        .no {
            color: red;
        }

        #validation-result {
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/oauth-client.js"></script>
    <script src="js/app.js"></script>
</head>

<body>
    <div class="container">
        <h1>IDP Client (jQuery)</h1>

        <div class="status-line">
            Logged In? <span id="status-loggedin" class="status-value no">No</span>
        </div>

        <div id="validation-result"></div>

        <div id="user-info" style="margin-top: 1rem; font-size: 0.9rem; color: #666; display: none;">
            Welcome! <br>
            Access Token Stored locally.
        </div>

        <div class="controls">
            <button id="btn-login">Login</button>
            <button id="btn-validate"
                style="background-color: #e6f7ff; color: #005580; border: 1px solid #005580; display: none;">Validate</button>
            <button id="btn-logout" style="display: none;">Logout</button>
        </div>
    </div>
</body>

</html>
